<?xml version="1.0" encoding="UTF-8"?>
<!-- JotJotBoom app icon: a phosphor terminal frame with two jots and a boom. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1a10"/>
      <stop offset="1" stop-color="#050806"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#4dff8f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4dff8f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#000" fill-opacity="0.28"/>
    </pattern>
    <clipPath id="screen"><rect x="18" y="26" width="92" height="76" rx="6"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#glass)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#glow)"/>

  <!-- screen frame, btop style: title notch cut into the top edge -->
  <rect x="18" y="26" width="92" height="76" rx="6" fill="#070b08" stroke="#1f5a2f" stroke-width="2.5"/>
  <g clip-path="url(#screen)">
    <rect x="18" y="26" width="92" height="76" fill="url(#scan)"/>
  </g>
  <!-- notch: two jots (the title) -->
  <rect x="26" y="20" width="28" height="12" rx="3" fill="#070b08"/>
  <circle cx="34" cy="26" r="3.6" fill="#4dff8f"/>
  <circle cx="46" cy="26" r="3.6" fill="#4dff8f"/>

  <!-- lines of text on screen -->
  <rect x="30" y="44" width="42" height="5" rx="2.5" fill="#2f8a4a"/>
  <rect x="30" y="56" width="58" height="5" rx="2.5" fill="#2f8a4a"/>
  <rect x="30" y="68" width="34" height="5" rx="2.5" fill="#2f8a4a"/>
  <!-- block cursor -->
  <rect x="68" y="65" width="8" height="12" rx="1" fill="#4dff8f"/>

  <!-- boom: a burst breaking out of the frame -->
  <g transform="translate(96 86)">
    <polygon fill="#4dff8f" points="0,-22 5,-8 19,-14 10,-2 24,4 9,6 14,20 2,10 -6,23 -7,8 -22,12 -12,1 -23,-8 -9,-8 -12,-22 -3,-11"/>
    <polygon fill="#0b3a1c" points="0,-11 3,-4 10,-7 5,-1 12,2 4,3 7,10 1,5 -3,12 -4,4 -11,6 -6,0 -12,-4 -5,-4 -6,-11 -2,-5"/>
    <circle cx="0" cy="0" r="2.6" fill="#b9f2bf"/>
  </g>
</svg>
