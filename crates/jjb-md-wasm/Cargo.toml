[package]
name = "jjb-md-wasm"
description = "JotJotBoom's markdown scanner for the browser-side editor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Build: cargo build -p jjb-md-wasm --target wasm32-unknown-unknown --release
#        wasm-bindgen --target web --out-dir <dir> target/wasm32-unknown-unknown/release/jjb_md_wasm.wasm
# The CLI version must equal the wasm-bindgen crate version pinned below.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jjb-core.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.129"

[dev-dependencies]
serde_json.workspace = true
