# Attic — a Rust core with one shell per platform.
#
#   crates/jjb-core     notes, store, sync, markdown scanner, images, links,
#                       tables, platform trait. No toolkit. Builds for Windows.
#   crates/jjb-md-wasm  the markdown scanner for the browser-side editor.
#   apps/jjb-cosmic     the libcosmic app (COSMIC and GNOME), the reference
#                       build until the Tauri app is the better GNOME app.
#
# `cargo build` / `cargo test` at the root cover all three; the wasm crate's
# parity test builds it for `wasm32-unknown-unknown` itself (and skips when
# the wasm target, the wasm-bindgen CLI or node is missing).
[workspace]
resolver = "3"
members = ["crates/jjb-core", "crates/jjb-md-wasm", "apps/jjb-cosmic"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/reddemo0110/attic"

[workspace.dependencies]
# Members opt into `full`; the wasm scanner takes the pure modules only.
jjb-core = { path = "crates/jjb-core", default-features = false }
anyhow = "1"
blake3 = "1"
chrono = "0.4"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
open = "5.3.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tracing = "0.1"
ureq = { version = "3", features = ["json", "multipart"] }
uuid = { version = "1", features = ["v7"] }
