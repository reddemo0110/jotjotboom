[package]
name = "jotjotboom"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Retro-flavoured markdown notes for the COSMIC desktop"
repository = "https://github.com/jotjotboom/jotjotboom"

[dependencies]
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
open = "5.3.2"
# Link previews: fetch a page's Open Graph title/description/picture.
ureq = "3"
rust-embed = "8.8.0"
tokio = { version = "1.48.0", features = ["full"] }

# Storage: markdown files on disk, SQLite (FTS5) as the derived index.
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
chrono = "0.4"
blake3 = "1"
dirs = "6"
anyhow = "1"
# The rich editor drives cosmic-text directly (same version iced uses).
cosmic-text = "0.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Debug-only self-screenshot (JJB_SCREENSHOT=path) for headless visual checks.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

# Secrets live in the system keyring from day one (sync tokens later).
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }

[build-dependencies]
xdgen = "0.1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
# Remove features if not needed.
features = [
    # About widget for the app
    "about",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # GPU-accelerated rendering
    "wgpu",
    # xdg portal dialogs on Linux
    "xdg-portal"
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }

[dev-dependencies]
tempfile = "3"
